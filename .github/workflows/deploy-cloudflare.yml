name: Deploy Sozan Tutor OS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sozan-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker and D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          preCommands: |
            npm install
            npm run check
            wrangler d1 migrations apply DB --remote --yes
          command: deploy
